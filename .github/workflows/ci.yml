name: CI

on:
  pull_request:
  push:
    branches: [ "main" ]
  release:
    types: [created]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: OpenHarmony tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    container:
      image: hqzing/dockerharmony:7.0@sha256:2befba873913622f3395ff35d9f135e44efc4c33b0969f671d707e17339b1ecb
      volumes:
        - /opt/node24:/__e/node24:rw,rshared
    env:
      OHOS_NODE_VERSION: v26.13.1
      OHOS_NODE_SHA256: 47941e9bd4345276c78868446797a00b9a10cfb6b8a8f8793fe58ad62b4bb522
    steps:
      - name: Setup OpenHarmony Node.js
        run: |
          set -eu
          archive="/tmp/node-${OHOS_NODE_VERSION}-openharmony-arm64.tar.gz"
          node_home="/opt/node-${OHOS_NODE_VERSION}-openharmony-arm64"
          curl -fsSL -o "$archive" \
            "https://github.com/hqzing/ohos-node/releases/download/${OHOS_NODE_VERSION}/node-${OHOS_NODE_VERSION}-openharmony-arm64.tar.gz"
          echo "${OHOS_NODE_SHA256}  ${archive}" | sha256sum -c -
          tar -zxf "$archive" -C /opt
          mkdir -p /__e/node24/bin
          ln -sf "$node_home/bin/node" /__e/node24/bin/node
          echo "OHOS_NODE_HOME=${node_home}" >> "$GITHUB_ENV"
          echo "${node_home}/bin" >> "$GITHUB_PATH"
          "$node_home/bin/node" --version
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test
        run: npm test

  publish:
    name: Publish to npm
    if: github.event_name == 'release'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org/'
      - name: Publish to npm
        run: npm publish --access=public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
